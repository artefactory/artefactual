[project]
name = "artefactual"
dynamic = ["version"]
description = "Hallucination detection for black-box LLMs from token log-probabilities"
readme = "README.md"
authors = [
    { name = "Hicham Randrianarivo", email = "hicham.randrianarivo@artefact.com" },
    { name = "Gauthier Jeannin", email = "gauthier.jeannin@artefact.com" },
    { name = "Charles Moslonka", email = "charles.moslonka@artefact.com" },
    { name = "Charlotte Le Bihan", email = "charlotte.lebihan@student-cs.fr" },
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.11,<3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beartype>=0.19.0",
    "pydantic>=2.12.5",
    "numpy>=1.24.0",
    # 1.8 is the floor the published detectors impose, not a preference: they are skops
    # dumps of a LogisticRegression fitted under a newer scikit-learn, and 1.7 reads
    # `multi_class` off the loaded estimator, which those files do not carry. 1.8 also
    # requires Python >= 3.11, which is where `requires-python` above comes from.
    "scikit-learn>=1.8.0",
    "skops>=0.14.0",
    "huggingface-hub>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/artefactory/artefactual"
Documentation = "https://artefactory.github.io/artefactual/"
Repository = "https://github.com/artefactory/artefactual"
Issues = "https://github.com/artefactory/artefactual/issues"

[project.optional-dependencies]
adapters = [
    # 5.0 removed `api.trace.get`, which the evaluator reads traces with.
    "langfuse>=4.8.1,<5",
    "openai>=2.41.1",
]
docs = [
    "jupytext>=1.19.5",
    "myst-nb>=1.1",
    "pydata-sphinx-theme~=0.16.1",
    # The reveal.js decks under docs/presentations/ are rendered by Quarto before Sphinx
    # runs, and Sphinx copies the result in through html_extra_path. The PyPI package ships
    # the Quarto binary itself, so the toolchain the site needs is pinned here with
    # everything else rather than installed by a CI action the local build has no way to
    # reproduce.
    "quarto-cli~=1.10.18",
    "sphinx~=8.1.3",
    "sphinx-autodoc-typehints~=3.0.1",
    "sphinx-llms-txt>=0.7.1",
    # A published page whose document is renamed keeps its URL: the extension writes a
    # meta-refresh page at the old path, which is all GitHub Pages can serve -- there is no
    # server-side redirect to configure.
    "sphinx-reredirects~=1.0",
    # The guide draws its pipeline, its file contract and its label polarity as diagrams.
    "sphinxcontrib-mermaid~=1.0.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the most recent tag reachable from HEAD, so a build carries the
# version of the release it was cut from and no committed file restates it.
[tool.hatch.version]
source = "vcs"

# Without this the default scheme guesses the *next* version by incrementing the last
# component -- 2026.07.0 becomes 2026.7.1.devN. Under CalVer the next release is
# 2026.08.0, so that guess names a version that will never exist. `no-guess-dev` counts
# forward from the released tag instead: 2026.7.0.post1.devN.
raw-options = { version_scheme = "no-guess-dev" }

# Build output, generated from the tag and never committed, holding the version as a
# literal for `__init__.py` to import. Written to its own module because the hook
# overwrites whatever file it targets.
[tool.hatch.build.hooks.vcs]
version-file = "src/artefactual/_version.py"

# hatch-vcs offers hatchling every path the VCS knows about, and with no explicit target
# the sdist takes the repository root -- .jj, .workspaces and the docs build included,
# which is 22 MB of working state a user never asked for. Both targets are named here so
# what ships is what the package needs to build and be tested.
[tool.hatch.build.targets.sdist]
# Anchored with a leading slash: unanchored, `src/artefactual` also matches
# `.workspaces/<name>/src/artefactual`, and a jj workspace checked out under the repo
# would be packaged along with it.
include = [
    "/src/artefactual",
    "/tests",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/artefactual"]


[dependency-groups]
dev = [
    "absl-py>=2.1.0",
    "datasets>=3.2.0",
    "einops>=0.8.0",
    "faiss-cpu>=1.9.0.post1",
    "fastembed>=0.4.2 ; sys_platform == 'darwin'",
    "grain>=0.2.3",
    "ipython>=8.31.0",
    "jinja2>=3.1.5",
    "jupytext>=1.16.6",
    # tests/test_notebook_structure.py parses the notebooks' markdown as CommonMark rather
    # than scanning it. Arrives with myst-parser in the `docs` extra too, but CI runs the
    # tests on a bare `uv sync`, so it is named here rather than left to a transitive.
    "markdown-it-py>=3.0.0",
    # tests/test_detector_sklearn_contract.py feeds a Series to the detectors; named here
    # because CI runs the tests on a bare `uv sync` and should not rely on a transitive.
    "pandas>=2.2.0",
    "plum-dispatch>=2.5.7",
    "scikeras>=0.13.0",
    "toolz>=1.0.0",
    "wandb>=0.19.4",
    "mlcroissant>=1.0.12",
    "polars>=1.21.0",
    "orjson>=3.10.15",
    "tokenizers>=0.21.0",
    "transformers>=4.48.1",
    "outlines>=0.1.11",
    "pudb>=2024.1.3",
    "pydantic>=2.10.6",
    "jupyterlab>=4.3.5",
    # docs/examples/train_wepr.ipynb plots a learning curve and a precision-recall
    # comparison, and tests/test_examples.py executes it, so the figures are drawn on a
    # bare `uv sync` rather than only where the docs are built.
    "matplotlib>=3.9.0",
    "hypothesis>=6.127.8",
    "ruff>=0.17.6,<0.18",
    "ty>=0.0.1a32",
    "prek>=0.5.0",
    "bump-my-version>=0.28.0",
    "git-cliff>=2.12.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

# Everything needed to build the site with its notebooks executed: `uv sync --group
# notebooks` is the one command, for CI and for a clone alike. It layers the runtime the
# examples need on top of the `docs` extra, because a published page showing a notebook's
# output only exists if the notebook ran.
#
# A group rather than a [project.optional-dependencies] extra, because `bert-judge` is a
# git URL: a direct reference in a distribution's metadata is rejected on upload to PyPI,
# and groups are not part of that metadata. That is also why the merge goes this way round
# -- the group may depend on the extra, never the reverse.
notebooks = [
    # train_wepr_pipeline.md and langfuse_integration_demo.md call an endpoint.
    "artefactual[adapters]",
    # MyST-NB executes the notebooks from the Sphinx process, so Sphinx and the judge's
    # runtime have to be the same environment.
    "artefactual[docs]",
    "jupyterlab>=4.3.5",
    # train_wepr_pipeline.ipynb renders its two prompts, the paper's, as the templates they
    # are.
    "jinja2>=3.1.5",
    # The judge's progress bar asks for it, and warns on every call without it.
    "ipywidgets>=8.1.0",
    # train_wepr.ipynb draws a learning curve and a precision-recall comparison.
    "matplotlib>=3.9.0",
    # train_wepr_lightweight_judge.ipynb. `bert-judge` declares no dependencies of its own, so the
    # judge's runtime is named here. The transformers range is the checkpoint's: outside
    # it the load fails, on `torch_dtype=` below 4.57 and `KeyError: 'default'` at 5.x.
    "bert-judge @ git+https://github.com/artefactory/BERT-as-a-Judge.git",
    "torch>=2.0.0",
    "transformers>=4.57,<6",
    "datasets>=3.2.0",
]

# The notebooks run the encoder judge on CPU -- there is no GPU on a docs runner, and no
# GPU in a clone's default environment either. Left to PyPI, `torch` resolves to the CUDA
# build and drags in some 40 nvidia-* wheels, several GB that nothing here ever loads, so
# Linux takes the CPU wheels instead. macOS wheels are CPU-only already and are unaffected.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.coverage.run]
# `source` (not `--cov=artefactual`) so the namespace package under adapters/ lands in
# the denominator too — it has no __init__.py, and the package-name scanner walks
# right past it.
source = ["src/artefactual"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.codespell]
ignore-words-list = "rouge,ans"

[tool.ruff]
preview = true
target-version = "py310"
line-length = 120
output-format = "concise"
extend-exclude = [
    "demo_uncertainty_notebook.ipynb",
    "demo.ipynb",
    "demo_uncertainty.py",
    "scripts/**/*",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
select = [
    "A",   # builtins abuse (pep8-naming + flake8-builtins)
    "ARG", # unused arguments
    "B",   # bugbear correctness warnings
    "BLE", # blind/overbroad excepts
    "C",   # complexity checks
    "DTZ", # naive datetime usage
    "E",   # pycodestyle errors
    "EM",  # error message construction
    "F",   # pyflakes correctness
    "FBT", # boolean traps
    "I",   # import sorting
    "ICN", # import conventions
    "ISC", # implicit string concatenation
    "LOG", # logging format/usage
    "N",   # naming
    "PTH", # prefer pathlib over os.path
    "PLE", # pylint errors
    "PIE", # pie comprehensions / misc correctness
    "RET", # return statement consistency
    "RUF", # Ruff-specific rules
    "S",   # security (bandit)
    "SIM", # simplify overcomplicated code
    "SLF", # private/protected member access
    "T",   # type hints
    "T10", # debug statements
    "T20", # print statements
    "TID", # tidy imports
    "TRY", # safer exception handling
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "FURB",# refurb refactors
]
extend-select = [
    "missing-return-type-public-function", # public functions must have return type
    "missing-return-type-static-method", # staticmethod must have return type
    "missing-return-type-class-method", # classmethod must have return type
    "too-many-return-statements", # too many return statements
    "too-many-branches", # too many branches
    "too-many-arguments", # too many arguments
    "too-many-statements", # too many statements
    "sys-exit-alias", # consider using sys.exit over exit/quit
]

ignore = [
    "single-line-implicit-string-concatenation",
    "redefined-while-unused",
    "multiple-with-statements",    # low-signal simplify cases
    "yoda-conditions",    # low-signal simplify cases
    "function-call-in-dataclass-default-argument",    # docstring param order (style)
    # Formatter conflicts (Ruff docs)
    "tab-indentation",      # tab indentation
    "indentation-with-invalid-multiple",      # indentation with invalid multiple
    "indentation-with-invalid-multiple-comment",      # indentation with invalid multiple (comment)
    "over-indented",      # over-indented
    "multi-line-implicit-string-concatenation",    # multi-line implicit string concat (formatter handles)
    # Bandit: keep only Jinja-template-related ignores
    "jinja2-autoescape-false", "mako-templates", "unsafe-markup-use",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# The detector factories take one positional argument and the rest keyword-only; a
# keyword-only option is not the argument-ordering hazard PLR0913 is guarding against.
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Notebooks under docs/examples/. E402 because a notebook introduces an import where it
# introduces the topic -- numpy where training starts, scikit-learn's metrics where
# evaluation does. Read as one module, which is how the linter sees a notebook, every one
# of those is an import after code, and hoisting them into the first cell would move each
# away from the paragraph that explains it.
#
# B018 is the notebook idiom of ending a cell on a bare name so the kernel renders its
# repr -- `logprobs.shape` on its own line is how a reader sees what a step produced. Read
# as a module, which is how the linter sees a notebook, that is an expression with no
# effect; in a notebook it is the output.
#
# The glob is `docs/examples/*`, not a suffix: jupytext lints a MyST example by writing its
# cells out as a `.py` beside itself and running ruff on that, under a generated name. It
# matches at any depth, so a `.py` added anywhere under `docs/examples/` is covered too.
"docs/examples/*" = ["useless-expression", "module-import-not-at-top-of-file"]
"**/scripts/*" = [
    "implicit-namespace-package",
    "print",
    "T20",
    "too-many-positional-arguments",
    "too-many-arguments",
    "function-call-in-dataclass-default-argument",
    "boolean-positional-value-in-call",
    "line-too-long",
    "too-many-locals",
    "builtin-import-shadowing",
]
# The conftest sets the Hub environment before its first import: huggingface_hub reads it
# once, when `constants` is imported, so every later import is by design after code.
"tests/conftest.py" = ["module-import-not-at-top-of-file"]
"**/tests/**/*" = [
    "compare-to-empty-string",
    "magic-value-comparison",
    "no-self-use",
    "S",
    "relative-imports",
    "ANN",  # allow untyped returns in tests
]
"**/*.ipynb" = [
    "print",    # print statements allowed in notebooks
    "p-print",    # pprint statements allowed in notebooks
    "builtin-import-shadowing",    # notebooks import IPython's `display`, which shadows a builtin
    "ANN",     # type annotations not required in notebooks
    "zip-without-explicit-strict",    # zip() without strict is fine in notebooks
    "line-too-long",    # line length relaxed in notebooks
    "magic-value-comparison", # magic values allowed in notebooks
    "assert",    # assert allowed in notebooks
    "commented-out-code",  # commented-out code allowed in notebooks
    "unused-import",    # unused imports allowed (often for demo/exploration)
    "implicit-namespace-package",  # implicit namespace package
    "builtin-import-shadowing",    # IPython's display shadows a builtin; that is the documented import
]
"examples/*.ipynb" = ["print", "p-print", "builtin-import-shadowing"]

[tool.ruff.lint.isort]
known-first-party = ["artefactual"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

# Not a pairing directive and not read by any hook -- pairing needs `formats`, which
# nothing here sets. It shapes `jupytext --to py:percent`, the ad-hoc conversion that is
# the reason jupytext stays in the dev group at all, so it stays with it.
[tool.jupytext]
cell_markers = '"""'

[tool.ty]

[tool.ty.terminal]
output-format = "concise"

[tool.ty.src]
exclude = ["tests/", "scripts", "examples"]

[tool.ty.rules]
import-not-found = "ignore"

# Computes the next version and creates its tag; it writes no files and makes no commit,
# because the tag is what the version is read from. `current_version` is absent so the
# current value is discovered from the most recent tag reachable from HEAD, which keeps
# the two ends of a release -- what is tagged and what is built -- reading the same source.
[tool.bumpversion]
parse = """(?x)
    (?P<release>
        (?:[1-9][0-9]{3})\\.     # YYYY.
        (?:1[0-2]|0[1-9])        # 0M
    )
    \\.(?P<patch>\\d+)           # .patch
"""
serialize = ["{release}.{patch}"]
commit = false
tag = true
tag_name = "v{new_version}"

[tool.bumpversion.parts.release]
calver_format = "{YYYY}.{0M}"

[tool.bumpversion.parts.patch]
first_value = "0"
