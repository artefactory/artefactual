{# Runs a notebook page's two entry points -- open it in Colab, or download the .ipynb --
   in the article header. Rendered only where `html-page-context` in conf.py supplied the
   two values, so every other page emits nothing. #}
{% if notebook_filename %}
  <div class="notebook-buttons">
    <a class="btn btn-sm navbar-btn" href="{{ colab_url }}" target="_blank" rel="noopener"
       title="Run {{ notebook_filename }} in Google Colab">
      <img src="https://colab.research.google.com/assets/colab-badge.svg"
           alt="Open in Colab" style="vertical-align: middle; height: 1.25rem">
    </a>
    <a class="btn btn-sm navbar-btn" href="{{ notebook_filename }}" download
       title="Download {{ notebook_filename }}">
      <i class="fa-solid fa-download"></i> {{ notebook_filename }}
    </a>
  </div>
{% endif %}
