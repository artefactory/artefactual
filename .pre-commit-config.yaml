# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        # The ECIR prompts reproduce the paper's indented f-string. Their trailing
        # indentation is part of the prompt the model was given, so stripping it would
        # change the experiment rather than tidy the file.
        exclude: ^scripts/ecir/prompts/
    -   id: end-of-file-fixer
        exclude: ^scripts/ecir/prompts/
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: debug-statements
    -   id: no-commit-to-branch
        args: [--branch, main]
    -   id: mixed-line-ending

-  repo: https://github.com/astral-sh/ruff-pre-commit
   rev: v0.14.11
   hooks:
   -   id: ruff-check
       types_or: [python, pyi]
       args: [--fix]
   -   id: ruff-format
       types_or: [python, pyi]
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.3.0
  hooks:
    - id: conventional-pre-commit
      stages: [commit-msg]
      args: [--verbose, feat, fix, chore, test]
- repo: https://github.com/nbQA-dev/nbQA
  rev: 1.9.1
  hooks:
    # nbQA does not pin the tool it drives, so these two floated to whatever ruff was
    # newest -- 0.16.6 against the 0.14.x this project pins in `pyproject.toml` and in the
    # ruff hook above. That is not a cosmetic gap: 0.16 migrates `# noqa: RULE` to the new
    # `# ruff: ignore[rule-name]` suppression syntax and rewrites the file to match, and
    # 0.14 does not know that syntax and reports RUF103 on it. So the hook edited notebooks
    # into a state the project's own `ruff check` rejected, on every run. Held to the same
    # range as the dev group.
    - id: nbqa-ruff
      additional_dependencies: ["ruff>=0.14.8,<0.15"]
      args: ["--fix", "--extend-ignore=T201,T203,ANN,B905,E501,PLR2004,S101,ERA001,F401,INP001"]
    - id: nbqa-ruff-format
      additional_dependencies: ["ruff>=0.14.8,<0.15"]
    - id: nbqa-pyupgrade
      args: [--py310-plus]
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.1
  hooks:
    - id: codespell
      files: \.(py|md)$
- repo: local
  hooks:
    - id: ty
      name: ty check
      entry: >
        uvx --prerelease=allow ty check src/artefactual
        --ignore=unresolved-import
        --output-format=concise
      language: python
      files: ^src/artefactual/
