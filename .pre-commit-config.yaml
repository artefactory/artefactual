# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        # The ECIR prompts reproduce the paper's indented f-string. Their trailing
        # indentation is part of the prompt the model was given, so stripping it would
        # change the experiment rather than tidy the file.
        exclude: ^scripts/ecir/prompts/
    -   id: end-of-file-fixer
        exclude: ^scripts/ecir/prompts/
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: debug-statements
    -   id: no-commit-to-branch
        args: [--branch, main]
    -   id: mixed-line-ending

-  repo: https://github.com/astral-sh/ruff-pre-commit
   rev: v0.14.11
   hooks:
   -   id: ruff-check
       types_or: [python, pyi]
       args: [--fix]
   -   id: ruff-format
       types_or: [python, pyi]
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.3.0
  hooks:
    - id: conventional-pre-commit
      stages: [commit-msg]
      args: [--verbose, feat, fix, chore, test]
# The examples are MyST Markdown, so nbQA has nothing to drive: there is no .ipynb in the
# repository for it to unpack. jupytext reads the same cells and pipes them through the ruff
# this project pins, which is what nbQA was here to do -- without nbQA's habit of floating
# the tool it drives to a version the project's own `ruff check` then rejects.
- repo: https://github.com/mwouts/jupytext
  rev: v1.19.5
  hooks:
    - id: jupytext
      name: jupytext ruff-format (examples)
      files: ^docs/examples/(?!index\.md$).*\.md$
      args: ["--pipe", "ruff format -", "--pre-commit-mode"]
      additional_dependencies: ["ruff>=0.14.8,<0.15"]
    - id: jupytext
      alias: jupytext-ruff-check
      name: jupytext ruff check (examples)
      files: ^docs/examples/(?!index\.md$).*\.md$
      args:
        - "--check"
        - "ruff check --extend-ignore=T201,T203,ANN,B905,E501,PLR2004,S101,ERA001,F401,INP001 {}"
      additional_dependencies: ["ruff>=0.14.8,<0.15"]
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.1
  hooks:
    - id: codespell
      files: \.(py|md)$
- repo: local
  hooks:
    - id: ty
      name: ty check
      entry: >
        uvx --prerelease=allow ty check src/artefactual
        --ignore=unresolved-import
        --output-format=concise
      language: python
      files: ^src/artefactual/
