name: Pre-commit checks
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main]  # run when pushing to main
  pull_request:
    branches: [main]  # run on PRs targeting main
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b  # v7.2.0
        with:
          version: "0.9.15"
          enable-cache: true

      - name: Configure SKIP for the hooks
        run: echo "SKIP=no-commit-to-branch" >> "$GITHUB_ENV"

      # Version pinned: an unpinned prek changes what this gate does with no commit in this
      # repository. The hooks themselves are pinned by `rev:` in .pre-commit-config.yaml,
      # and prek caches the hook environments itself.
      - name: Run the hooks
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3  # v3.1.1
        with:
          prek-version: 0.5.11
