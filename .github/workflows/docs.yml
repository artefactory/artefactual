name: Build and Deploy Documentation

# The site is published by the release pipeline, not by a merge. A merge to main and a
# pull request still build it -- a broken build is worth catching where it is introduced --
# but only a release deploys, so the published pages always describe the version on PyPI.
#
# Called rather than triggered by the tag: a tag pushed with GITHUB_TOKEN starts no
# workflow run, so `on: push: tags:` would never fire. `release.yaml` calls this after the
# GitHub Release exists.
on:
  push:
    branches:
      - main
  pull_request:
  # Republish the site without cutting a version: executing by default, since the outputs
  # committed in the notebooks are not what the site is meant to show.
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the built site to GitHub Pages.
        type: boolean
        default: true
      execute:
        description: Run the notebooks and publish the outputs they produce.
        type: boolean
        default: true
      # Republishing a release means building its tag, not main: run
      # `gh workflow run docs.yml --ref v2026.09.0 -f version=2026.09.0`. Dispatching from
      # main with a released version here would overwrite that version's pages with main.
      version:
        description: Version the built pages name, as its tag spells it (e.g. 2026.09.0).
        type: string
        required: true
  workflow_call:
    inputs:
      deploy:
        description: Publish the built site to GitHub Pages.
        type: boolean
        default: false
      execute:
        description: Run the notebooks and publish the outputs they produce.
        type: boolean
        default: false
      version:
        description: Version the built pages name. Empty means read it from the git tag.
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  # Read by docs/conf.py, which switches MyST-NB to "force" when it is set. Only the
  # release build sets it: executing reaches the Hugging Face Hub, which a pull request
  # should not have to wait on.
  ARTEFACTUAL_EXECUTE_NOTEBOOKS: ${{ inputs.execute && '1' || '' }}
  # conf.py reads the version from the installed package. On a release the tag does not
  # exist yet -- the whole point of building here is to gate its creation -- so the caller
  # passes the version it is about to tag and hatch-vcs reports that instead of deriving
  # one. Empty everywhere else, which falls through to the git tag and yields the .dev
  # version that puts the development banner on the page.
  #
  # The unsuffixed name is deliberate: hatch-vcs ignores the per-package
  # SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ARTEFACTUAL form. Only this project is built from
  # source here, so the broader scope reaches nothing else.
  SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
  # conf.py reports cell stderr as a Sphinx warning, which -W turns into a failed build --
  # so a notebook that warns its way through a release fails it instead. Progress bars are
  # written to stderr and would fail every executing build on their own, saying nothing.
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  TRANSFORMERS_VERBOSITY: error
  TQDM_DISABLE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    # A build that executes downloads the checkpoints its notebooks load (some 500 MB) and
    # runs the encoder judge on CPU -- around five minutes on a cold runner. nb_execution_timeout
    # in conf.py caps a single cell; this caps the job, well under the 6 h GitHub would
    # otherwise allow it to burn.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Installing the package derives its version from the most recent reachable tag.
          # A shallow checkout fetches none, and hatch-vcs falls back to 0.1.dev1 with only
          # a warning, so the site would document a version that was never released.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904  # v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      # The notebooks group already depends on the docs extra, so an executing build names
      # only the group. A build that does not execute reads the outputs stored in the .ipynb
      # files and needs none of the runtime the group adds -- torch alone is 2 GB -- so it
      # installs the extra by itself.
      # --reinstall-package: SETUPTOOLS_SCM_PRETEND_VERSION is not part of uv's cache key,
      # so a cached build of the package would be reused and the pages would name the
      # version that was cached rather than the one being released.
      - name: Install dependencies
        run: uv sync ${{ inputs.execute && '--group notebooks' || '--extra docs' }} --reinstall-package artefactual

      # MyST-NB shells out to pandoc for the notebooks' markdown cells. Without it
      # every notebook fails to read and the build stops, which -W turns into an error.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pandoc

      # Quarto comes from the docs extra (the PyPI package ships the binary), so the
      # deck toolchain is the one pinned in pyproject.toml and a local build renders the
      # decks exactly as this job does.
      - name: Render presentation decks
        run: uv run quarto render docs/presentations

      - name: Build documentation
        # -W: a page Sphinx declines to build -- a notebook MyST-NB skips, a missing
        # toctree entry, a broken cross-reference -- is reported as a warning and would
        # otherwise deploy a site with the page silently absent.
        #
        # -d: the doctree cache defaults to `.doctrees` *inside* the output directory, and
        # the whole directory is what gets published -- some 11 MB of pickles per release,
        # two fifths of the build, kept in the archive of every version online for nothing.
        # Sphinx reads them back on an incremental build; a release build is always cold.
        run: uv run sphinx-build -W -d docs/_build/doctrees -b html docs docs/_build/html

      - name: Check the decks reached the site
        run: |
          # Quarto writes the decks into docs/_extra before Sphinx runs. Producing none
          # leaves that directory empty, which Sphinx copies without complaint, so -W
          # cannot see this failure and it is asserted here.
          shopt -s nullglob
          decks=(docs/_build/html/presentations/*/*.html)
          if [ ${#decks[@]} -eq 0 ]; then
            echo "::error::no rendered deck under docs/_build/html/presentations/"
            exit 1
          fi
          printf 'deployed deck: %s\n' "${decks[@]}"

      - name: Check the example notebooks reached the site
        run: |
          # MyST-NB reading a notebook as an ordinary page is silent: the build succeeds,
          # the page looks close to right and nothing ran. Assert instead.
          shopt -s nullglob
          missing=0
          for source in docs/examples/*.md; do
            name=$(basename "${source%.md}")
            [ "$name" = index ] && continue
            page="docs/_build/html/examples/$name.html"
            if [ ! -f "$page" ]; then
              echo "::error::$source did not build to $page"
              missing=1
            elif [ ! -f "docs/_build/html/examples/$name.ipynb" ]; then
              # Every page offers its notebook as a download, and conf.py writes that file
              # beside the page at the end of the build. Its absence is silent under -W.
              echo "::error::$source built a page but no downloadable notebook beside it"
              missing=1
            else
              echo "deployed example: $page"
            fi
          done
          exit $missing

      # A plain artifact, not a Pages one: on a release the deploy job assembles this build
      # into the archive of every previous release and publishes *that* tree. A pull request
      # never reaches the deploy job, so for it this upload is only a build product.
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: site
          path: docs/_build/html
          retention-days: 1

  deploy:
    # `inputs.deploy` alone, never `github.event_name`: in a called workflow the event is
    # the *caller's*, so a release started by `gh workflow run release.yaml` would read as a
    # manual run and deploy the site here -- before PyPI has the version, and even if the
    # required reviewer declines it. On a push or a pull request there are no inputs at all
    # and this is null, which is falsy.
    if: inputs.deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write   # push the archive branch
      pages: write
      id-token: write
    steps:
      # Only the scripts and the composite action are needed from the repository here;
      # the built pages arrive as an artifact and the archive as a branch.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - name: Assemble the versioned site
        uses: ./.github/actions/publish-site
        with:
          version: ${{ inputs.version }}
          site-url: https://artefactory.github.io/artefactual
          token: ${{ github.token }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
