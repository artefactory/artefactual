name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904  # v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render presentation decks
        run: quarto render docs/presentations

      - name: Build documentation
        run: uv run sphinx-build -b html docs docs/_build/html

      - name: Check the decks reached the site
        run: |
          # html_extra_path failures are warnings, not errors: assert instead.
          shopt -s nullglob
          decks=(docs/_build/html/presentations/*/*.html)
          if [ ${#decks[@]} -eq 0 ]; then
            echo "::error::no rendered deck under docs/_build/html/presentations/"
            exit 1
          fi
          printf 'deployed deck: %s\n' "${decks[@]}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
