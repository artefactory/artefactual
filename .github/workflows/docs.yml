name: Build and Deploy Documentation

# The site is published by the release pipeline, not by a merge. A merge to main and a
# pull request still build it -- a broken build is worth catching where it is introduced --
# but only a release deploys, so the published pages always describe the version on PyPI.
#
# Called rather than triggered by the tag: a tag pushed with GITHUB_TOKEN starts no
# workflow run, so `on: push: tags:` would never fire. `release.yaml` calls this after the
# GitHub Release exists.
on:
  push:
    branches:
      - main
  pull_request:
  # Republish the site without cutting a version: executing by default, since the outputs
  # committed in the notebooks are not what the site is meant to show.
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the built site to GitHub Pages.
        type: boolean
        default: true
      execute:
        description: Run the notebooks and publish the outputs they produce.
        type: boolean
        default: true
  workflow_call:
    inputs:
      deploy:
        description: Publish the built site to GitHub Pages.
        type: boolean
        default: false
      execute:
        description: Run the notebooks and publish the outputs they produce.
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  # Read by docs/conf.py, which switches nbsphinx to "always" when it is set. Only the
  # release build sets it: executing reaches the Hugging Face Hub, which a pull request
  # should not have to wait on.
  ARTEFACTUAL_EXECUTE_NOTEBOOKS: ${{ inputs.execute && '1' || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A build that executes downloads the checkpoints its notebooks load (some 500 MB) and
    # runs the encoder judge on CPU -- around five minutes on a cold runner. nbsphinx_timeout
    # in conf.py caps a single cell; this caps the job, well under the 6 h GitHub would
    # otherwise allow it to burn.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Installing the package derives its version from the most recent reachable tag.
          # A shallow checkout fetches none, and hatch-vcs falls back to 0.1.dev1 with only
          # a warning, so the site would document a version that was never released.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904  # v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      # The notebooks group already depends on the docs extra, so an executing build names
      # only the group. A build that does not execute reads the outputs stored in the .ipynb
      # files and needs none of the runtime the group adds -- torch alone is 2 GB -- so it
      # installs the extra by itself.
      - name: Install dependencies
        run: uv sync ${{ inputs.execute && '--group notebooks' || '--extra docs' }}

      # nbsphinx shells out to pandoc to convert the notebooks' markdown cells. Without it
      # every notebook fails to read and the build stops, which -W turns into an error.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pandoc

      # Quarto comes from the docs extra (the PyPI package ships the binary), so the
      # deck toolchain is the one pinned in pyproject.toml and a local build renders the
      # decks exactly as this job does.
      - name: Render presentation decks
        run: uv run quarto render docs/presentations

      - name: Build documentation
        # -W: a page Sphinx declines to build -- a notebook nbsphinx skips, a missing
        # toctree entry, a broken cross-reference -- is reported as a warning and would
        # otherwise deploy a site with the page silently absent.
        run: uv run sphinx-build -W -b html docs docs/_build/html

      - name: Check the decks reached the site
        run: |
          # Quarto writes the decks into docs/_extra before Sphinx runs. Producing none
          # leaves that directory empty, which Sphinx copies without complaint, so -W
          # cannot see this failure and it is asserted here.
          shopt -s nullglob
          decks=(docs/_build/html/presentations/*/*.html)
          if [ ${#decks[@]} -eq 0 ]; then
            echo "::error::no rendered deck under docs/_build/html/presentations/"
            exit 1
          fi
          printf 'deployed deck: %s\n' "${decks[@]}"

      - name: Check the example notebooks reached the site
        run: |
          # nbsphinx skipping a notebook is a warning, not an error: assert instead.
          shopt -s nullglob
          missing=0
          for nb in docs/examples/*.ipynb; do
            page="docs/_build/html/examples/$(basename "${nb%.ipynb}").html"
            if [ ! -f "$page" ]; then
              echo "::error::$nb did not build to $page"
              missing=1
            elif [ ! -f "${page%.html}.ipynb" ]; then
              # Every page offers its notebook as a download, and the file that link
              # points at is the copy nbsphinx writes beside the page. Its absence is
              # silent under -W, so it is asserted here alongside the page itself.
              echo "::error::$nb built a page but no downloadable notebook beside it"
              missing=1
            else
              echo "deployed example: $page"
            fi
          done
          exit $missing

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # `inputs.deploy` alone, never `github.event_name`: in a called workflow the event is
    # the *caller's*, so a release started by `gh workflow run release.yaml` would read as a
    # manual run and deploy the site here -- before PyPI has the version, and even if the
    # required reviewer declines it. On a push or a pull request there are no inputs at all
    # and this is null, which is falsy.
    if: inputs.deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
